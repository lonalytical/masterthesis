project:
  type: book
  output-dir: .

book:
  title: "Handling Missing Data in Multilevel Models with Few Clusters: A Simulation Study"
  date: "Submission date: May 05, 2026"
  author:
    name: Lona Frießner
  downloads: [pdf]
  abstract: "Multilevel studies often involve two challenges simultaneously: small numbers of clusters and missing data. However, the performance of modern missing-data methods under these combined conditions remains insufficiently understood, particularly in models with missing predictor variables and contextual effects. This thesis examines the performance of multiple imputation, using both conventional and small-sample-corrected degrees of freedom, and compares it with a fully Bayesian approach in a simulation study. The study features a simple random-intercept model with a manifest group-mean predictor, with missings in the predictor variable and one level-2 auxiliary variable. Simulation conditions varied in terms of intraclass correlation (.1 vs. .3), missingness mechanism (MAR vs. MCAR), between-group effect size (0 vs. 0.4), and level-2 sample size (15, 30, 60).  Method performance was evaluated in terms of bias, coverage, standard deviation of point estimates, and interval width. Results indicate a trade-off between bias and interval width for the between-group effect: multiple imputation tended to produce more biased estimates, particularly under low intraclass correlation conditions, whereas the Bayesian approach yielded wider credible intervals. As coverage under conventional degrees of freedom was already close to the nominal level, the small-sample correction tended to result in overcoverage. The findings are discussed with regard to methodological limitations and their implications for applied multilevel research."
  chapters:
    - index.qmd
    - chapters/theory.qmd
    - chapters/methods.qmd
    - chapters/results.qmd
    - chapters/discussion.qmd
    - references.qmd
  appendices:
    - appendices/AppendixA.qmd
    - appendices/convergence.qmd
    - appendices/AppendixB.qmd
    - appendices/AppendixC.qmd

  repo-url: https://github.com/lonalytical/masterthesis
  search: true

thesis:
  supervisor: 
    - name: Prof. Dr. Simon Grund 
    - name: Mark Lustig
  degree-name: Master of Science
  university: University of Hamburg
  department: Quantitative Methods
  group: Institute of Psychology
  faculty: Faculty of Psychology and Human Movement Science
