  code-overflow: wrap

# urlcolor changes the url color in the body of the PDF
# linkcolor changes color of internal links (like to figures)
# toclinkcolor changes color of toc, lof and lot links
format:
  quarto-thesis-pdf:
    urlcolor: blue
    toclinkcolor: black
    toc-depth: 2
    classoption:
      - 11pt
      - english
      - singlespacing
      - headsepline
      - openany
    link-citations: true
    include-in-header:
      text: |
        \usepackage{enumitem}
        \setlist[itemize]{label=--}
        \usepackage{tabularx}
        \renewcommand{\arraystretch}{1.2}
        \captionsetup{width=\textwidth}
    include-after-body: 
        - "backmatter/eid.tex"
        - "backmatter/gAI.tex"
        
    
