project:
  type: book
  output-dir: .

book:
  title: "Handling Missing Data in Multilevel Models with Few Clusters: A Simulation Study"
  date: "Submission date: May 05, 2026"
  author:
    name: Lona Frießner
  downloads: [pdf]
  abstract: "Hier kommt der Abstract hin"
  chapters:
    - index.qmd
    - chapters/theory.qmd
    - chapters/methods.qmd
    - chapters/results.qmd
    - chapters/discussion.qmd
    - references.qmd
  appendices:
    - appendices/AppendixA.qmd
    - appendices/convergence.qmd
    - appendices/AppendixB.qmd
    - appendices/AppendixC.qmd

  repo-url: https://github.com/lonalytical/masterthesis
  search: true

thesis:
  supervisor: 
    - name: Prof. Dr. Simon Grund 
    - name: Mark Lustig
  degree-name: Master of Science
  university: University of Hamburg
  department: Quantitative Methods
  group: Institute of Psychology
  faculty: Faculty of Psychology and Human Movement Science
  #declaration: "frontmatter/declaration.tex"
  #quotation:
  #  text: "Thanks to my solid academic training, today I can write hundreds of words on virtually any topic without possessing a shred of information, which is how I got a good job in journalism."
  #  attribution: Dave Barry
  #acknowledgements: "frontmatter/acknowledgements.tex"
  #abbreviations: "frontmatter/abbreviations.tex"
  #symbols: "frontmatter/symbols.tex"
  #dedication: "frontmatter/dedication.tex"
  logo: images/logo.png
  logo-height: "3cm"

bibliography: [bibliography.bib]
csl: apa.csl

execute:
  echo: false
  code-overflow: wrap

# urlcolor changes the url color in the body of the PDF
# linkcolor changes color of internal links (like to figures)
# toclinkcolor changes color of toc, lof and lot links
format:
  quarto-thesis-pdf:
    urlcolor: blue
    toclinkcolor: black
    toc-depth: 2
    classoption:
      - 11pt
      - english
      - singlespacing
      - headsepline
      - openany
    include-in-header:
      text: |
        \usepackage{enumitem}
        \setlist[itemize]{label=--}
        
    
